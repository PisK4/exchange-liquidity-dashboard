name: catalog-refresh

# Monthly auto-refresh of config/instrument_catalog.yaml and
# backend/docs/raw-instruments/. Runs make catalog (which crawls 10
# exchange public endpoints), opens a PR with the regenerated dumps and
# yaml, and lets a human review before merge.
#
# Why a PR instead of direct push:
#   - the dumps are committed code (used at runtime by CatalogResolver
#     and at startup by build-catalog), so an exchange schema change
#     could land a malformed dump that breaks the live backend if pushed
#     unattended;
#   - reviewing the diff also surfaces upstream listings/delistings that
#     might warrant front-end / docs updates.
#
# Triggered:
#   - manually via "Run workflow" (workflow_dispatch);
#   - on the 1st of every month at 03:30 UTC, half an hour after the
#     existing catalog-drift.yml weekly check so they don't compete for
#     the same CI runner pool.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: regenerate catalog + raw-instruments
        working-directory: backend
        # `make catalog` writes ../config/instrument_catalog.yaml plus
        # docs/raw-instruments/<platform>-<market>/<YYYY-MM-DD>.json.
        # When the run happens on a network that cannot reach a subset of
        # exchanges, the partial-failure exit code surfaces here so the
        # PR step is skipped — better to no-op than commit a half-baked
        # dump set.
        run: make catalog

      - name: detect changes
        id: changes
        run: |
          if git diff --quiet -- config/instrument_catalog.yaml backend/docs/raw-instruments; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no catalog drift; skipping PR"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/catalog-refresh-${{ github.run_id }}
          base: main
          commit-message: |
            chore(edgex-ops-intelligence): monthly catalog + raw-instruments refresh

            Auto-generated by .github/workflows/catalog-refresh.yml.
          title: 'chore(edgex-ops-intelligence): monthly catalog + raw-instruments refresh'
          body: |
            Auto-generated monthly refresh of `config/instrument_catalog.yaml`
            and `backend/docs/raw-instruments/<platform>/<date>.json`.

            **Review checklist**
            - [ ] Diff under `backend/docs/raw-instruments/` only adds new
                  symbols / dumps; deletions imply an upstream delisting and
                  should be cross-referenced with the exchange announcement.
            - [ ] `config/instrument_catalog.yaml` changes match the raw-
                  instruments diff.
            - [ ] Spot-check that `quanto_multiplier` (gate),
                  `market_id` (lighter), and `contract_id` (edgeX) values
                  on existing rows are unchanged — drift here breaks the
                  CatalogResolver lookup for already-tracked symbols.

            Once merged, redeploy the backend (the binary copies the dump
            tree into `/app/docs/raw-instruments` at build time) so the
            Top30 backfill goroutine can resolve any newly listed bases.
          delete-branch: true
          labels: |
            automation
            catalog-refresh
