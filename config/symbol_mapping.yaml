  # ---- Stocks (synthetic_futures / TRADIFI proxy) ----
  # On most venues the canonical is the plain ticker (TSLA / AAPL / ...)
  # but bingx ships TWO product lines: AAPLX-USDT (synthetic equity perp)
  # and NCSK<TICKER>2USD-USDT (NASDAQ-mirrored synthetic). MEXC suffixes
  # the synthetic perp with STOCK to avoid conflicting with the underlying
  # crypto canonical. Gate appends X. The alias list captures the
  # priority order build-catalog walks, leaving the platforms without an
  # entry as Unsupported (see the C1 collector contract).
  - display_symbol: TSLA-USDT (perp)
    display_name: TSLA-USD
    canonical: TSLA
    asset_category: stock
    market_surface: synthetic_futures
    instrument_kind: synthetic
    aliases:
      bingx: [NCSKTSLA2USD]
      mexc: [TSLASTOCK]
      gate: [TSLAX]
