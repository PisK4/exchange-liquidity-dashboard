  # ---- Commodities (synthetic_futures / RWA) ----
  # Canonical names follow the dashboard convention {COMMODITY}-USD.
  # Aliases enumerate the per-platform base_asset variants so build-catalog
  # can resolve them: GOLD has multiple coexisting representations (XAU
  # synthetic, PAXG / XAUT token-backed RWA), so the alias list is the
  # priority order build-catalog walks until it finds a candidate.
  - display_symbol: GOLD-USDT (perp)
    display_name: GOLD-USD
    canonical: GOLD
    asset_category: commodity
    market_surface: synthetic_futures
    instrument_kind: synthetic
    aliases:
      binance: [XAU, PAXG, XAUT]
      bybit: [XAU, PAXG, XAUT]
      bitget: [XAU, PAXG, XAUT]
      bingx: [NCCOGOLD2USD, PAXG, XAUT]
      mexc: [PAXG, XAUT]
      gate: [XAU, PAXG, XAUT]
      hyperliquid: [XAU, PAXG]
      lighter: [PAXG]
      edgeX: [PAXG, XAUT]
