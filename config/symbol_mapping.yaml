# Source of truth for symbol expansion. Backend reads this file at startup and
# expands each canonical symbol across the configured platform list.
#
# Schema (v2, multi-token support):
#   canonical        — Stable business key (BTC / GOLD / TSLA). Used as URL
#                      key (?symbol=BTC) and DB key for daily aggregates.
#   display_name     — UI label shown in dropdown, KPI, table headers
#                      (BTC-USD / GOLD-USD / TSLA-USD). Falls back to
#                      "{canonical}-USD" when omitted.
#   display_symbol   — Legacy storage key (e.g. "BTC-USDT (perp)") kept for
#                      backward compatibility with daily aggregates and
#                      existing URLs; new entries SHOULD specify it
#                      explicitly to keep store keying deterministic.
#   asset_category   — One of crypto / commodity / stock / index_etf.
#                      Drives the dropdown filter; does not influence
#                      ranking / median / share calculations.
#   market_surface   — perp / spot / synthetic_futures / rwa_spot / ...
#                      (default: perp)
#   instrument_kind  — canonical / synthetic / rwa / proxy / ...
#                      (default: canonical)
#
# Build-catalog-only fields (read by backend/scripts/build-catalog; the
# runtime config loader ignores them after the catalog has been generated):
#   aliases:
#     <platform>: [<base_asset alias>, ...]
#       — Tells the crawler "on this platform the canonical's base_asset
#         actually looks like one of these". Required for non-crypto
#         canonicals where exchanges expose synthetic names like
#         "NCSKSAMSUNG2USD" for SAMSUNG. Matched case-insensitively
#         against inst.BaseAsset; falls back to base==canonical when no
#         alias is configured.
#   preferred_surface: [perp, synthetic_futures, rwa_spot, spot]
#       — Tiebreaker when multiple instruments on the same platform match
#         the canonical (e.g. perp + synthetic_perp + rwa_spot). The
#         build-catalog generator picks the earliest matching surface.
#   platform_overrides:
#     <platform>:
#       market_surface: synthetic_futures
#       instrument_kind: synthetic
#       lineage: "bingx:NCSKSAMSUNG2USD@synthetic_futures"
#       — Baked into instrument_catalog.yaml as the post-merge values for
#         (platform, canonical). The runtime adapter sees only the
#         resolved fields, never the override declaration itself.
symbols:
  - display_symbol: BTC-USDT (perp)
    display_name: BTC-USD
    canonical: BTC
    asset_category: crypto
    market_surface: perp
    instrument_kind: canonical
  - display_symbol: ETH-USDT (perp)
    display_name: ETH-USD
    canonical: ETH
    asset_category: crypto
    market_surface: perp
    instrument_kind: canonical
  - display_symbol: SOL-USDT (perp)
    display_name: SOL-USD
    canonical: SOL
    asset_category: crypto
    market_surface: perp
    instrument_kind: canonical
platforms: [edgeX, binance, okx, bybit, bitget, bingx, mexc, gate, hyperliquid, lighter]
