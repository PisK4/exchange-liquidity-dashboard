# unresolved_symbols.yaml -- ops review backlog (V1 phase 9)
#
# Covers two distinct concerns:
#   1. platform_issues  -- exchange-level technical questions
#                          (e.g. lighter REST semantics, adapter quirks)
#   2. canonical_issues -- symbol-level business / coverage questions:
#                            * zero-platform canonicals
#                            * ambiguous tickers (multiple plausible
#                              underlying instruments)
#                            * single-platform coverage that risks
#                              biased liquidity comparisons
#                            * non-standard tickers from doc01 §4.3
#
# Workflow: ops/PM reviews canonical_issues, decides per row:
#   - confirm : keep canonical and aliases as-is
#   - rename  : adjust canonical or aliases (V1.1 follow-up)
#   - disable : remove from symbol_mapping.yaml (V1.1 follow-up)
# After review the rows that get sign-off are deleted from this file.

platform_issues:
  - platform: lighter
    issue: REST orderbook URL and market id semantics need official confirmation; V1 reports unsupported instead of fabricating data.

