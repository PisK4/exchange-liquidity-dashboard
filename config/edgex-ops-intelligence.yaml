Database:
  # Fill these in Nacos for dev/prod. Leave empty for local in-memory mode
  # unless OPS_INTELLIGENCE_MYSQL_DSN is provided via .env or environment.
  Name: ""
  Addr: ""
  UserName: ""
  Password: ""
  ParseTime: true
  MaxIdleConn: 4
  MaxOpenConn: 8
  ConnMaxLifeTime: 30m

Alert:
  # Alert display identity. Runtime/deployment identifiers such as
  # edgex-ops-intelligence, OPS_INTELLIGENCE_* and edgex_ops_intelligence are intentionally
  # preserved elsewhere for compatibility.
  AppName: edgex-ops-intelligence
  Enabled: true
  FeishuUid: ""
  DestPhoneNumber: ""
  Business: ""
  ServerUrl: ""
  WebHookP12: ""
  # Listing Agent Top30 hot-gap Lark bot webhook. This top-level Alert
  # block mirrors the Nacos-style service alert config used by other
  # EdgeX services; Listing Agent only consumes it, not its own module.
  WebHookP3: "https://open.larksuite.com/open-apis/bot/v2/hook/2983a36c-de31-4190-99b4-e256662bb8f7"
  WebHookP45: ""
  # Business-module routing. Webhooks.Listing replaces WebHookP3 and
  # holds Top30 hot-gap (#1) + CEX/DEX divergence (#2-#5) cards.
  # Webhooks.Liquidity is a separate bot dedicated to Dashboard
  # liquidity-lag (#10) and worst-depth (#11) cards so operators can
  # mute / forward those independently. Leave Webhooks.* empty to
  # fall back to the legacy WebHookP3 (Listing only). New deployments
  # SHOULD migrate to Webhooks; this is the long-term schema.
  Webhooks:
    Listing: "https://open.larksuite.com/open-apis/bot/v2/hook/2983a36c-de31-4190-99b4-e256662bb8f7"
    # Leave empty so liquidity_alert.enabled=true cannot accidentally
    # cross-post into the Listing group. Operators provision a
    # dedicated bot in the Liquidity group and paste its URL here
    # before flipping enabled=true.
    Liquidity: ""
    # Activity Agent uses its own Lark bot for local operator validation.
    # Production should still inject this through ACTIVITY_LARK_WEBHOOK_URL
    # or a private runtime overlay.
    Activity: "https://open.larksuite.com/open-apis/bot/v2/hook/091da0b1-bcfe-432e-a15a-79dfeba56714"

Catalog:
  ExchangeEndpointsFile: exchange_endpoints.yaml
  SymbolMappingFile: symbol_mapping.yaml
  InstrumentCatalogFile: instrument_catalog.yaml
  ListedUniverseFile: listed_universe.yaml

Runtime:
  collection_interval: 5m
  http_timeout: 12s
  # Optional HTTP/HTTPS proxy for the 9 native exchange REST adapters. Set
  # this to e.g. http://host.docker.internal:7897 when the dashboard runs in
  # a container whose runtime network cannot reach binance/okx/bybit/...
  # directly. Leave blank in production environments that can reach the
  # upstream exchanges over the open internet — latency measurements are
  # clearest without an intermediary.
  exchange_proxy: "http://host.docker.internal:7897"
  lighter_ws_url: wss://mainnet.zklighter.elliot.ai/stream?readonly=true
  lighter_stale_after: 15s
  display_fallback_window: 30m
  depth_tiers: [0.0005, 0.001, 0.01, 0.02]
  slippage_buckets_usd: [50000, 100000, 500000, 1000000]
  volume_discounts:
    mexc: 0.4
    gate: 0.5

  # Native 5min REST collection limits. Keep this independent from Top30
  # backfill so live orderbook/ticker pressure can be tuned separately.
  collection:
    per_platform_concurrency: 3
    per_platform_rate_per_sec: 4
    # EdgeX public quote endpoints are more sensitive to bursty fan-out
    # than the CEX APIs; keep it slower than the global rate to avoid
    # 429 / CF challenge pages without blocking startup on full serialization.
    platform_overrides:
      edgeX:
        concurrency: 2
        rate_per_sec: 2

  ws_providers:
    bitget:
      enabled: true
      url: wss://stream.bitget.com/public/v1/stream
      proxy: "http://host.docker.internal:7897"
      stale_after: 15s
    mexc:
      enabled: true
      url: wss://futures.mexc.com/edge?Trans-Protocol=JSON
      proxy: "http://host.docker.internal:7897"
      stale_after: 15s
    okx:
      enabled: true
      url: wss://wspri.okx.com:8443/ws/v5/ipublic
      stale_after: 15s
    bybit:
      enabled: false
      url: wss://ws2.bybit.com/realtime_w
      proxy: "http://host.docker.internal:7897"
      stale_after: 15s
    bingx:
      enabled: false
      url: wss://open-api-swap.bingx.com/swap-market
      proxy: "http://host.docker.internal:7897"
      stale_after: 15s
  history:
    enabled_windows: [24h]
    disabled_windows:
      7d: insufficient_history
      30d: insufficient_history

  # CoinGecko derivatives ingestion (R1: no process-env proxy).
  # When enabled=true the dashboard will pull /derivatives?include_tickers=unexpired
  # every pull_interval and UPSERT the resulting per-platform 24h volumes plus a
  # per-day rollup into MySQL. proxy is read as a literal URL; if blank the
  # CoinGecko client goes direct. Do NOT set HTTPS_PROXY / HTTP_PROXY at the
  # process level — that would also route the 9 native exchange adapters through
  # the proxy and pollute their latency measurements.
  coingecko:
    enabled: true
    base_url: https://api.coingecko.com/api/v3
    api_key_env: COINGECKO_DEMO_API_KEY
    proxy: "http://host.docker.internal:7897"
    pull_interval: 5m
    cache_ttl: 10m
    request_timeout: 30s
    governance:
      enabled: true
      requests_per_minute: 4
      burst: 1
      default_cooldown: 15m
      max_cooldown: 1h
      stale_cache_ttl: 2h
      backfill_enabled: true
      backfill_boot_delay: 20m
      backfill_requests_per_minute: 2
      listing_coin_id_cache_ttl: 24h
      listing_market_snapshot_cache_ttl: 1h
    exchange_id:
      edgeX: edgex
      binance: binance_futures
      okx: okex_swap
      bybit: bybit
      bitget: bitget_futures
      bingx: bingx_futures
      mexc: mxc_futures
      gate: gate_futures
      hyperliquid: hyperliquid
      lighter: lighter
    market_name:
      edgeX: "edgeX"
      binance: "Binance (Futures)"
      okx: "OKX (Futures)"
      bybit: "Bybit (Futures)"
      bitget: "Bitget Futures"
      bingx: "BingX (Futures)"
      mexc: "MEXC (Futures)"
      gate: "Gate (Futures)"
      hyperliquid: "Hyperliquid (Futures)"
      lighter: "Lighter"

  # Top30 CEX vs DEX divergence view classification. Any platform not
  # listed here is ignored by the divergence aggregator. significant_rank_delta
  # is the |Δrank| threshold above which a symbol is tagged cex_heavy /
  # dex_heavy instead of aligned.
  top30_divergence:
    cex_platforms: [binance, okx, bybit, bitget, mexc, gate, bingx]
    dex_platforms: [hyperliquid, lighter, edgeX]
    significant_rank_delta: 10

  # Top30 7d Vol / 7d Δ backfill. The backfiller iterates over the union of
  # base assets currently ranked in every platform's Top30 and pulls daily
  # kline rows from the platform's native endpoint, persisted as
  # data_source=native_backfill. The schedule fires once at boot (after a
  # 90s warmup so the first /derivatives round populates the roster) and
  # again every UTC day at schedule_utc_hour:schedule_utc_minute. Defaults
  # below are sized for free-tier exchange budgets — operators with paid
  # tiers can raise per_platform_concurrency / per_platform_rate_per_sec.
  backfill:
    enabled: true
    cold_start_days: 14
    daily_repair_days: 3
    per_platform_concurrency: 3
    per_platform_rate_per_sec: 4
    schedule_utc_hour: 2
    schedule_utc_minute: 30

  # Listing Agent P1 backend detection + Top30 hot-gap push. See
  # architecture/方案设计/EdgeX运营/Listing/2026-05-27-Listing-Agent-P1-主链路方案设计.md
  # §23 for the authoritative knobs.
  listing_agent:
    enabled: true
    worker:
      lease_ttl: 2m
      max_attempts: 5
      retry_backoff: [1m, 5m, 15m, 1h]
    sources:
      instrument_diff:
        enabled: true
        polls:
          - platform: binance
            market_type: usdm_futures
            poll_interval: 3m
          - platform: bybit
            market_type: linear
            poll_interval: 3m
          - platform: okx
            market_type: swap
            poll_interval: 5m
          - platform: bitget
            market_type: usdt_futures
            poll_interval: 5m
          - platform: mexc
            market_type: contract
            poll_interval: 5m
          - platform: hyperliquid
            market_type: perp
            poll_interval: 3m
          # Dynamic-discovery sources (spec 2026-06-01 §A). edgeX's own
          # 3 surfaces use signaling_mode: snapshot_only so their diff
          # events do NOT feed the listing decision loop (spec F5) —
          # they exist solely to populate t_listing_instrument_snapshot
          # for the universe-refresh job and the CatalogResolver
          # DB-first lookup. The other 6 polls (bingx x2, gate x2,
          # lighter x2) emit full signals.
          - platform: edgeX
            market_type: perp_v1
            poll_interval: 5m
            signaling_mode: snapshot_only
          - platform: edgeX
            market_type: perp_v2
            poll_interval: 5m
            signaling_mode: snapshot_only
          - platform: edgeX
            market_type: spot
            poll_interval: 5m
            signaling_mode: snapshot_only
          - platform: bingx
            market_type: spot
            poll_interval: 5m
          - platform: bingx
            market_type: swap
            poll_interval: 5m
          - platform: gate
            market_type: spot
            poll_interval: 5m
          - platform: gate
            market_type: usdt_futures
            poll_interval: 5m
          - platform: lighter
            market_type: perp
            poll_interval: 5m
          - platform: lighter
            market_type: spot
            poll_interval: 5m
      announcement:
        enabled: true
        polls:
          - platform: bybit
            poll_interval: 3m
          - platform: bitget
            poll_interval: 3m
          - platform: binance
            poll_interval: 5m
    listed_universe_refresh:
      enabled: true
      interval: 15m
      # seed_path is intentionally relative to --config-dir; the
      # runtime path lives under OPS_INTELLIGENCE_DATA_DIR so a restart does
      # not lose the latest refresh.
      seed_path: listed_universe.yaml
      runtime_path: ${OPS_INTELLIGENCE_DATA_DIR}/listed_universe.runtime.yaml
      fresh_window: 30m
      seed_shrink_floor: 0.5
      covered_platforms:
        - binance
        - bybit
        - okx
        - bitget
        - mexc
        - hyperliquid
        - edgeX
        - bingx
        - gate
        - lighter
    delivery:
      enabled: true
      # Webhook target is configured in the top-level Alert block so the
      # same YAML shape can be promoted to Nacos. Keep delivery here for
      # Listing-specific retry/outbox toggles only.
      top30_webhook_url: ""
      top30_webhook_url_env: ""
      top30_webhook_secret: ""
      # EdgeX Ops Intelligence base URL embedded into the Top30 push card's
      # "📊 查看 Top30 详情" primary button. The renderer appends
      # "?symbol=<display_symbol>" (or "&symbol=" if the base already
      # has a query string), so put your tab pre-selection here, e.g.
      # "https://dashboard.example.com/?tab=top30". When this field is
      # empty the primary button is suppressed (the K-line secondary
      # button still renders). Different deployments fill this with
      # their own URL — local Docker stacks typically use something
      # like "http://localhost:3001/?tab=top30"; production should set
      # the public Ops Intelligence hostname here. The preview CLI in
      # backend/scripts/top30-preview reads this same value via
      # --config-dir, so changing it here covers both the production
      # listing engine and ad-hoc operator previews.
      dashboard_base_url: "https://exchange-liquidity-dashboard-pisk4s-projects.vercel.app/?tab=top30"
      # Optional HTTP/HTTPS proxy for the Lark webhook delivery client
      # only. Do NOT promote this to a process-wide HTTPS_PROXY env --
      # that would also route the 9 native exchange REST adapters and
      # the CoinGecko collector through this proxy and pollute their
      # latency measurements. Leave blank when the deployment can dial
      # open.larksuite.com directly (e.g. in production). Local Docker
      # stacks on macOS typically need the same host proxy used for
      # exchanges, here e.g. http://host.docker.internal:7897.
      proxy: "http://host.docker.internal:7897"
    top30_push:
      enabled: true
      poll_interval: 5m
      stale_after: 15m
      # Auto-quiet a (display_symbol, action) pair once it has stayed in
      # the hot-gap funnel for this many consecutive UTC days. The
      # signal observation row is still recorded so the streak counter
      # stays accurate next day; only the outbox push is suppressed.
      # Set to 0 to disable auto-quiet entirely. Default 3, i.e. day 1
      # gets a NEW card, day 2 gets a "已第 2 天" card, day 3+ goes
      # silent until the symbol falls out of the funnel.
      auto_quiet_after_streak_days: 3
      # Cap how many outbox rows the delivery worker drains per engine
      # tick. Combined with send_spacing this prevents UTC-rollover
      # floods from spamming the Lark group when many symbols cross
      # the threshold simultaneously at 0:00 UTC. 0 falls back to the
      # delivery default (50). Default 2.
      max_per_tick: 2
      # Stagger NextAttemptAt across rows inserted in the same producer
      # pass: the i-th row is scheduled at (now + i * send_spacing).
      # Drain naturally serializes them across subsequent ticks (and
      # the WHERE next_attempt_at <= now filter), achieving a soft
      # "one card every send_spacing" pace inside a single batch.
      # Default 10m.
      send_spacing: 10m
    # Dashboard liquidity-alert (#10 / #11) tuning. Enabled=false by
    # default so SG can dry-run one outbox cycle before flipping
    # webhook delivery on. See architecture/方案设计/EdgeX运营/Listing/
    # 2026-05-29-Listing-Agent-Dashboard-Liquidity-Alerts-#10-#11.md.
    liquidity_alert:
      enabled: false
      # Depth tier the alert reads — must match a tier present in
      # Runtime.depth_tiers above so the freshness JOIN finds rows.
      depth_tier_pct: 0.001
      # edgeX < lag_threshold × competitor_median → fires #10. 0.5
      # means "below half the median".
      lag_threshold: 0.5
      # Minimum non-edgeX platforms with fresh, displayable depth at
      # this tier before any alert can fire. Spec §1 red line.
      min_comparators: 3
      # Re-emit cadence while the alert stays active.
      reissue_interval: 6h
      # Number of consecutive evaluation rounds the trigger must be
      # false before flipping active → cleared (hysteresis).
      clear_consecutive: 3
      # Snapshot freshness window. Older rows are excluded from the
      # median/rank.
      stale_after: 30m
      # Engine cadence for re-evaluating alerts. Should be ≥ the
      # depth collector cadence (5m).
      poll_interval: 5m
      # Cap on new outbox rows per producer tick.
      max_per_tick: 5
      # Stagger NextAttemptAt across rows written in one tick.
      send_spacing: 30s
    candidate:
      merge_window: 14d
      historical_listing_grace_period: 48h
    # Phase 2 — Lark decision card + button callback.
    # See docs/feat/listing-agent-decision-card-callback.md for the
    # button matrix, cooldown contract and callback security model.
    decision_card:
      # Master switch for the per-tick ProduceDecisionCards step in
      # listing.Engine.RunOnce. The producer writes one
      # t_listing_risk_plan + one t_listing_delivery_outbox row per
      # actionable candidate (lifecycle ∈ confirmed_listing_candidate
      # / announced_pending_api / api_detected_no_announcement /
      # pre_assessment_observed) and dedupe-keys by UTC day so a
      # restart inside the same day cannot re-emit.
      enabled: true
      # Suppression window after the operator clicks 忽略. Default is
      # the 24h §5 contract; bump it for symbols that should stay
      # quiet longer (e.g. low-tier observed but no longer growing).
      ignore_cooldown: 24h
      # Per-tick cap on new decision cards. Phase 3 smoke uses 5 so
      # all current real candidates (INJ / LAB / ALLO / BSB / BEAT)
      # receive a card on the same tick. Going below the candidate
      # count starves the cooldown gate: ListCandidates ORDER BY
      # last_observed_at DESC + LIMIT N would return the same top-N
      # each tick and the tail never gets evaluated. Tune down once
      # the producer learns to page through the candidate table or
      # the inflow rate stabilises.
      max_per_tick: 5
      callback:
        # Leaving secret + secret_env both blank keeps
        # /api/listing/callback returning 503: the cards land in
        # Lark but the buttons do not yet POST back. Provision the
        # operator open_id whitelist + secret only once we have a
        # sandbox Lark group set up for click-through validation.
        secret: ""
        secret_env: LARK_LISTING_CALLBACK_SECRET
        max_clock_skew: 300s
        operator_allow: []

  # Operations Activity Radar.
  activity_agent:
    enabled: true
    default_poll_interval: 1h
    scheduler:
      # Ingestion wakes up frequently, but each source still obeys its
      # own collection.poll_interval below. Producer/delivery run faster
      # so approved events do not wait for the next hourly collection tick.
      ingestion_interval: 5m
      producer_interval: 1m
      delivery_interval: 30s
    collection:
      default_poll_interval: 1h
      default_timeout: 15s
      source_proxy: ""
    worker_lease_ttl: 2m
    source_proxy: ""
    decision_token:
      secret_env: ACTIVITY_DECISION_TOKEN_SECRET
      ttl: 720h
    high_value_rules:
      source_groups: [launchpool_project_list, cms_article_detail, latest_events, support_ongoing_section]
      activity_type_candidates: [launchpool, airdrop_campaign, listing_trading_campaign, futures_trading_competition, seasonal_tournament, delisting_signal, non_cex_update_event, incentive_rule_snapshot]
      title_keywords: ["launchpool", "hodler", "airdrop", "candydrop", "poolx", "m-day", "competition", "giveaway", "prize pool", "trade to share", "new listing", "delist"]
      confirmed_reward_threshold_usd: 50000
    delivery:
      enabled: true
      webhook_url_env: ACTIVITY_LARK_WEBHOOK_URL
      collect_only_without_webhook: true
      proxy: "http://host.docker.internal:7897"
      dashboard_base_url: "http://127.0.0.1:3001/activity"
      max_per_tick: 20
      send_spacing: 2s
      source_health_cooldown: 1h
      event_update_cooldown: 1h
    sources:
      # Binance is currently observed as fetch_error in local Docker; keep
      # collection enabled and defer upstream fetch root-cause investigation.
      - platform: binance
        source_group: cms_article_list
        collection:
          enabled: true
          fetch_mode: http_direct
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
      - platform: okx
        source_group: help_announcement
        collection:
          enabled: true
          fetch_mode: http_direct
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
      # BingX is currently observed as fetch_error in local Docker; keep
      # collection enabled and defer upstream fetch root-cause investigation.
      - platform: bingx
        source_group: openapi_notice
        collection:
          enabled: true
          fetch_mode: http_direct_json
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
      - platform: gate
        source_group: launchpool_project_list
        collection:
          enabled: true
          fetch_mode: utls_proxy_json
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
        requires_proxy: true
      - platform: mexc
        source_group: latest_events
        collection:
          enabled: true
          fetch_mode: utls_proxy_html
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
        requires_proxy: true
      - platform: bybit
        source_group: announcements_ssr
        collection:
          enabled: true
          fetch_mode: utls_html
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
        requires_browser_context: true
      - platform: bitget
        source_group: support_ongoing_section
        collection:
          enabled: true
          fetch_mode: utls_html
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
        requires_browser_context: true
      - platform: hyperliquid
        source_group: cloudfront_entries
        collection:
          enabled: true
          fetch_mode: http_direct_json
          poll_interval: 1h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 3
      - platform: lighter
        source_group: incentive_docs
        collection:
          enabled: true
          fetch_mode: markdown_doc
          poll_interval: 24h
        delivery:
          enabled: true
          auto_push_enabled: true
          target_channel: lark_activity
          max_per_tick: 1
