services:
  mysql:
    image: mysql:8.0
    container_name: activity-e2e-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: edgex_ops_intelligence_activity_e2e
    ports:
      - "127.0.0.1:13307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/mysql
