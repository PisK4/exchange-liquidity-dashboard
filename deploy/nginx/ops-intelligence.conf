# EdgeX Ops Intelligence same-origin reverse proxy sample.
#
# Assumptions:
# - deploy/docker-compose.yaml publishes web on 127.0.0.1:3001.
# - deploy/docker-compose.yaml publishes backend on 127.0.0.1:8080.
# - TLS/certificates are managed by the host or an upstream AWS load balancer.
# - /metrics should be restricted to trusted monitoring networks.

server {
    listen 80;
    server_name ops-intelligence.example.com;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /metrics {
        # Replace this with the monitoring CIDR in AWS DEV/prod.
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
