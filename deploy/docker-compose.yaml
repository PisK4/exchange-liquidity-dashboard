services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edgex_ops_intelligence}
    # Bind to localhost only by default; override with MYSQL_PUBLISH_HOST
    # in .env when the operator deliberately wants MySQL exposed outside
    # the Docker host (highly discouraged in production).
    ports:
      - "${MYSQL_PUBLISH_HOST:-127.0.0.1}:${MYSQL_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    cpus: ${MYSQL_CPUS:-1.0}
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      # Forward the operator's BUILD_VERSION env var (set by
      # deploy/Makefile from `git describe --tags --always --dirty`)
      # to the Dockerfile's `ARG BUILD_VERSION`, which the Go build
      # then embeds into main.version via -ldflags. Without this
      # block compose silently drops the env var and the resulting
      # binary keeps reporting build_version=dev on /api/health,
      # making it impossible to tell which build is actually running
      # in production.
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    command: ["/app/ops-intelligence", "--role=all", "--addr=:8080"]
    environment:
      USE_LOCAL_CONFIG: ${USE_LOCAL_CONFIG:-true}
      OPS_INTELLIGENCE_CONFIG_SOURCE: ${OPS_INTELLIGENCE_CONFIG_SOURCE:-local}
      OPS_INTELLIGENCE_MYSQL_DSN: ${OPS_INTELLIGENCE_MYSQL_DSN:-root:root@tcp(mysql:3306)/edgex_ops_intelligence?parseTime=true}
      # OPS_INTELLIGENCE_DATA_DIR is the writable mount the listing engine
      # uses for files it regenerates at runtime (currently the
      # listed_universe.runtime.yaml rewritten every 15 min by
      # RefreshListedUniverseFromSnapshots). The path MUST match the
      # named-volume mount target below; otherwise the listing
      # engine cannot persist the refresh job's output and the CG
      # collector / decision-card lookup keep reading the
      # process-baked seed forever.
      OPS_INTELLIGENCE_DATA_DIR: /var/lib/edgex-ops-intelligence
      # HTTP_PROXY / HTTPS_PROXY are intentionally empty by default in
      # production. Set them in .env when the deployment sits behind a
      # corporate egress proxy. Leaving them empty makes the backend
      # call exchanges directly.
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      # Nacos config source. Local compose defaults to file mode; AWS DEV
      # sets USE_LOCAL_CONFIG=false or OPS_INTELLIGENCE_CONFIG_SOURCE=nacos.
      NACOS_CONFIG_SERVER_ADDR: ${NACOS_CONFIG_SERVER_ADDR:-}
      NACOS_CONFIG_SERVER_IP: ${NACOS_CONFIG_SERVER_IP:-}
      NACOS_CONFIG_SERVER_PORT: ${NACOS_CONFIG_SERVER_PORT:-}
      NACOS_CONFIG_NAMESPACE: ${NACOS_CONFIG_NAMESPACE:-}
      NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:-DEFAULT_GROUP}
      NACOS_CONFIG_NAME: ${NACOS_CONFIG_NAME:-edgex-ops-intelligence.yaml}
      NACOS_CONFIG_USERNAME: ${NACOS_CONFIG_USERNAME:-}
      NACOS_CONFIG_PASSWORD: ${NACOS_CONFIG_PASSWORD:-}
      # AWS Secrets Manager resolver. Region/secret id stay in env, while
      # Nacos Alert.Push owns Lark business webhook URLs.
      AWS_SM_ENABLE: ${AWS_SM_ENABLE:-false}
      AWS_SM_REGION: ${AWS_SM_REGION:-}
      AWS_SM_SECRET_ID: ${AWS_SM_SECRET_ID:-}
      # Module-scoped secrets/env indirections. Keep real values in
      # deploy/.env or a private config-dir, never in tracked YAML.
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      LARK_LISTING_TOP30_WEBHOOK_URL: ${LARK_LISTING_TOP30_WEBHOOK_URL:-}
      LARK_LISTING_CALLBACK_SECRET: ${LARK_LISTING_CALLBACK_SECRET:-}
      LARK_ACTIVITY_WEBHOOK_URL: ${LARK_ACTIVITY_WEBHOOK_URL:-}
      ACTIVITY_DECISION_TOKEN_SECRET: ${ACTIVITY_DECISION_TOKEN_SECRET:-}
    ports:
      - "${BACKEND_PUBLISH_HOST:-127.0.0.1}:${BACKEND_PUBLISH_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Liveness only -- /api/health always returns 200 once the process
      # is responsive. Pointing healthcheck at /api/readiness would put
      # the container into a restart loop during transient upstream
      # outages.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    cpus: ${BACKEND_CPUS:-1.0}
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    volumes:
      # Named volume the listing engine writes runtime yaml into. The
      # backend image runs as uid/gid 65532; the volume is created on
      # first boot with the right ownership by Docker.
      - ops-intelligence-data:/var/lib/edgex-ops-intelligence
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # NEXT_PUBLIC_* is inlined into the client JS bundle at build
        # time; it must be a URL the end-user's browser can reach, not
        # a Docker network hostname.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://127.0.0.1:8080}
    environment:
      # Used only by Next.js SSR inside the container; can stay on the
      # Docker internal network hostname.
      SERVER_API_BASE: ${SERVER_API_BASE:-http://backend:8080}
    ports:
      - "${WEB_PUBLISH_HOST:-127.0.0.1}:${WEB_PUBLISH_PORT:-3001}:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    cpus: ${WEB_CPUS:-1.0}
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
  ops-intelligence-data:
